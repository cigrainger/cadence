name: Draft a public preview release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 Scripts/check_repository.py
      - run: Scripts/scan_secrets.sh
      - run: python3 Scripts/check_advisories.py
  package:
    needs: public-source
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check tag and version
        run: |
          python3 - <<'PY'
          import os, plistlib
          version = plistlib.load(open('Resources/Info.plist', 'rb'))['CFBundleShortVersionString']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and application version differ'
          PY
      - run: python3 Scripts/check_repository.py
      - run: ./verify.sh --tests-only
      - run: ./build.sh
      - run: python3 Scripts/package_release.py --app dist/Cadence.app --output dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Create reviewable draft with source, checksums and notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "Cadence $RELEASE_TAG" --notes-file release/RELEASE-NOTES.md
