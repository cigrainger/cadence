name: Verify Cadence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python3 Scripts/check_repository.py
      - run: python3 -m unittest discover -s Scripts -p 'test_*.py'
      - name: Check first-party JavaScript syntax
        run: |
          node --test Scripts/test_site.cjs Scripts/test_score.cjs
          node --check site/assets/site.js
          node --check Resources/ScoreViewer/score.js
          node --check Resources/EditorViewer/editor.js
      - name: Scan public source and history for secrets
        run: Scripts/scan_secrets.sh
      - name: Check known dependency advisories
        run: python3 Scripts/check_advisories.py
  tests:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --configuration .swift-format --recursive Sources Tests
      - name: Verify the native graphical host
        run: python3 Scripts/check_native_ui_host.py
      - name: Test Swift 6, native workflows and whole-app coverage
        run: ./verify.sh --skip-accessibility --skip-audio-output
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadence-verification
          path: |
            .verification/*.json
            .verification/ui-host/*.json
            .verification/ui-host/*.log
            .verification/*.log
            .verification/first-launch/*.json
            .verification/first-launch/*.log
            .verification/native-coverage/**/manifest.json
            .verification/native-coverage/**/combined.json
            .verification/native-coverage/**/html/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
